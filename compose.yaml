services:

  backend:

    build:

      context: ./backend

    container_name: backend

    expose:

      - "3000"

    networks:

      - practice_network


  nginx:

    build:

      context: .

      dockerfile: nginx/Dockerfile

    container_name: nginx

    ports:

      - "5000:80"

    depends_on:

      - backend

    networks:

      - practice_network


networks:

  practice_network:

    driver: bridge